appId: com.revolt.volt
productName: Volt
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  target:
    - target: zip
      arch:
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # timestamping every electron resource adds minutes and gives a self-signed cert no value
  timestamp: none
  # hardened runtime enforces team-id library validation, which a teamless
  # self-signed cert can never satisfy; we don't notarize, so turn it off
  hardenedRuntime: false
  # long-lived self-signed cert; not an apple identity, so it must be named explicitly
  identity: Local Development Code Signing
  artifactName: ${name}-${version}-${arch}.${ext}
forceCodeSigning: true
npmRebuild: false
# publish config only feeds latest-mac.yml generation; the workflow uploads with gh
publish:
  provider: github
  owner: revolt-mono
  repo: agent-assets-manager
