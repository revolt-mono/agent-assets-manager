appId: com.revolt.volt
productName: Volt
directories:
  buildResources: build
files:
  - out/**/*
  - resources/icon.png
asarUnpack:
  - resources/**
electronLanguages:
  - en-US
  - zh-CN
mac:
  electronLanguages:
    - en-US
    - zh_CN
  target:
    - target: zip
      arch:
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # timestamping every electron resource adds minutes and gives a self-signed cert no value
  timestamp: none
  # hardened runtime enforces team-id library validation, which a teamless
  # self-signed cert can never satisfy; we don't notarize, so turn it off
  hardenedRuntime: false
  # long-lived self-signed cert; not an apple identity, so it must be named explicitly
  identity: Local Development Code Signing
  artifactName: ${name}-${version}-${arch}.${ext}
forceCodeSigning: true
npmRebuild: false
# publish config feeds latest-mac.yml and the packaged app-update.yml that
# electron-updater reads; the workflow uploads release assets with gh
publish:
  provider: github
  owner: revolt-mono
  repo: agent-assets-manager
