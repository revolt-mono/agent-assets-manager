name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the signing cert is self-signed; trust it so find-identity treats it as valid
      - run: sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain build/codesign-cert.pem
      - run: pnpm build && pnpm exec electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # electron-builder's github publisher races itself and creates duplicate
      # drafts when uploading assets in parallel, so upload with gh instead
      - run: >
          gh release create "$GITHUB_REF_NAME" --draft
          --title "Volt ${GITHUB_REF_NAME#v}" --notes ""
          dist/*-arm64.zip dist/*.blockmap dist/latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
